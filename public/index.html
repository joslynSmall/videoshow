<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="多平台视频解析与弹幕播放服务">
  <title>videoshow · 视频解析</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c6f36b'/%3E%3Cpath d='M12 9v14l11-7z' fill='%230b0d0c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/vendor/hls.min.js"></script>
  <script defer src="/vendor/artplayer.js"></script>
  <script defer src="/vendor/artplayer-plugin-danmuku.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="videoshow 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
            <title>videoshow</title>
            <path d="M8 5.5v13l10-6.5-10-6.5Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="brand-name">videoshow</span>
      </a>
      <div class="topbar-actions">
        <button id="history-toggle-button" type="button" class="icon-button" aria-label="播放历史" title="播放历史">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <title>播放历史图标</title>
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 3"/>
          </svg>
          <span class="button-label">历史</span>
        </button>
      </div>
    </header>

    <main>
      <section class="hero compact-hero">
        <form id="parse-form" class="parse-form" action="/" method="get" novalidate>
          <label class="sr-only" for="url-input">搜索剧名或视频链接</label>
          <div class="input-row">
            <div class="input-wrap">
              <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <title>搜索图标</title>
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.3-4.3"/>
              </svg>
              <input id="url-input" name="url" type="text" autocomplete="off" spellcheck="false" placeholder="输入剧名搜索，或粘贴视频页面链接..." required>
              <button id="clear-input-button" type="button" class="clear-button" hidden aria-label="清空输入">&times;</button>
            </div>
            <button id="submit-button" type="submit">解析 / 搜索</button>
          </div>
          <div id="search-history" class="search-history" hidden>
            <div class="search-history-head">
              <span>搜索历史</span>
              <button id="clear-search-history" type="button" class="ghost-button mini-button">清空</button>
            </div>
            <div id="search-history-list" class="search-history-list"></div>
          </div>
        </form>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section id="search-section" class="search-section" hidden>
        <div class="section-header">
          <h2 class="section-title">搜索结果</h2>
          <span id="search-count" class="section-sub"></span>
        </div>
        <div id="search-grid" class="search-grid"></div>
      </section>

      <section id="result" class="result" hidden>
        <div class="player-wrap">
          <div id="player" class="player"></div>
        </div>

        <div id="episodes-bar" class="episodes-bar" hidden>
          <div id="platform-bar" class="platform-bar" hidden></div>
          <div class="episodes-header">
            <div class="episodes-title-group">
              <span class="episodes-label">选集</span>
              <span id="current-episode-text" class="episodes-current"></span>
            </div>
            <button id="all-episodes-button" type="button" class="ghost-button mini-button">全集</button>
          </div>
          <div id="episodes-scroll" class="episodes-scroll"></div>
        </div>

        <div class="result-body">
          <div class="result-copy">
            <h2 id="video-title">视频</h2>
          </div>
          <div class="result-actions">
            <span id="expiry" class="expiry"></span>
          </div>
        </div>
      </section>
    </main>

    <!-- 播放历史模态弹窗 -->
    <div id="history-modal" class="modal-backdrop" hidden>
      <div class="modal-pane">
        <div class="modal-header">
          <h3>播放历史</h3>
          <div class="modal-header-actions">
            <button id="clear-history-button" type="button" class="ghost-button danger-ghost mini-button">清空</button>
            <button id="close-history-button" type="button" class="close-button" aria-label="关闭">&times;</button>
          </div>
        </div>
        <div id="history-list" class="history-list"></div>
      </div>
    </div>

    <!-- 全集选集模态弹窗 -->
    <div id="episodes-modal" class="modal-backdrop" hidden>
      <div class="modal-pane modal-pane-wide">
        <div class="modal-header">
          <h3 id="episodes-modal-title">剧集列表</h3>
          <button id="close-episodes-button" type="button" class="close-button" aria-label="关闭">&times;</button>
        </div>
        <div id="episodes-grid" class="episodes-grid"></div>
      </div>
    </div>

    <!-- 返回顶部悬浮按钮 -->
    <button id="back-to-top" class="back-to-top" type="button" aria-label="返回顶部" title="返回顶部" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <title>返回顶部</title>
        <path d="m18 15-6-6-6 6"/>
      </svg>
    </button>

    <footer class="footer">
      <p>服务端只做解析与地址校验，视频分片由源站 CDN 直接提供。</p>
      <p>请仅解析你有权访问的内容。</p>
    </footer>
  </div>

  <noscript>
    <p class="noscript">需要启用 JavaScript 才能解析和播放。</p>
  </noscript>
</body>
</html>
