<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="多平台视频解析与弹幕播放服务">
  <title>videoshow · 视频解析</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c6f36b'/%3E%3Cpath d='M12 9v14l11-7z' fill='%230b0d0c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/vendor/hls.min.js"></script>
  <script defer src="/vendor/artplayer.js"></script>
  <script defer src="/vendor/artplayer-plugin-danmuku.js?v=20261018"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="videoshow 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
            <title>videoshow</title>
            <path d="M8 5.5v13l10-6.5-10-6.5Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="brand-name">videoshow</span>
      </a>
      <div class="topbar-actions">
        <button id="history-toggle-button" type="button" class="icon-button" aria-label="播放历史" title="播放历史">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <title>播放历史图标</title>
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 3"/>
          </svg>
          <span class="button-label">历史</span>
        </button>
      </div>
    </header>

    <main>
      <section class="hero compact-hero">
        <form id="parse-form" class="parse-form" action="/" method="get" novalidate>
          <label class="sr-only" for="url-input">搜索剧名或视频链接</label>
          <div class="input-row">
            <div class="input-wrap">
              <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <title>搜索图标</title>
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.3-4.3"/>
              </svg>
              <input id="url-input" name="url" type="text" autocomplete="off" spellcheck="false" placeholder="输入剧名搜索，或粘贴视频页面链接..." required>
              <button id="clear-input-button" type="button" class="clear-button" hidden aria-label="清空输入">&times;</button>
            </div>
            <select id="search-channel" class="search-channel" aria-label="搜索渠道" title="API 渠道使用聚合接口；视频网站会分别访问各站搜索">
              <option value="api">API 渠道</option>
              <option value="sites">视频网站</option>
            </select>
            <button id="submit-button" type="submit">解析 / 搜索</button>
          </div>
          <div id="search-history" class="search-history" hidden>
            <div class="search-history-head">
              <span>搜索历史</span>
              <button id="clear-search-history" type="button" class="ghost-button mini-button">清空</button>
            </div>
            <div id="search-history-list" class="search-history-list"></div>
          </div>
        </form>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section id="search-section" class="search-section" hidden>
        <div class="section-header">
          <h2 class="section-title">搜索结果</h2>
          <span id="search-count" class="section-sub"></span>
        </div>
        <div id="search-grid" class="search-grid"></div>
      </section>

      <section id="result" class="result" hidden>
        <div class="player-wrap">
          <div id="player" class="player"></div>
        </div>

        <div id="episodes-bar" class="episodes-bar" hidden>
          <div id="platform-bar" class="platform-bar" hidden></div>
          <div class="episodes-header">
            <div class="episodes-title-group">
              <span class="episodes-label">选集</span>
              <span id="current-episode-text" class="episodes-current"></span>
            </div>
            <div class="episodes-actions">
              <label class="autoplay-toggle" title="播放结束后自动播放下一集">
                <input id="autoplay-next" type="checkbox" checked>
                <span class="switch-track" aria-hidden="true"></span>
                <span class="switch-text">自动下一集</span>
              </label>
              <button id="all-episodes-button" type="button" class="ghost-button mini-button">全集</button>
            </div>
          </div>
          <div id="episodes-scroll" class="episodes-scroll"></div>
        </div>

        <div class="result-body">
          <div class="result-copy">
            <h2 id="video-title">视频</h2>
          </div>
          <div class="result-actions">
            <span id="expiry" class="expiry"></span>
          </div>
        </div>
      </section>
    </main>

    <!-- 全局加载中遮罩层 -->
    <div id="loading-overlay" class="loading-overlay" hidden aria-live="assertive" role="alert">
      <div class="loading-box">
        <div class="loading-spinner" aria-hidden="true"></div>
        <p id="loading-text" class="loading-text">正在解析中，请稍候…</p>
      </div>
    </div>

    <!-- 播放历史模态弹窗 -->
    <div id="history-modal" class="modal-backdrop" hidden>
      <div class="modal-pane">
        <div class="modal-header">
          <h3>播放历史</h3>
          <div class="modal-header-actions">
            <button id="clear-history-button" type="button" class="ghost-button danger-ghost mini-button">清空</button>
            <button id="close-history-button" type="button" class="close-button" aria-label="关闭">&times;</button>
          </div>
        </div>
        <div id="history-list" class="history-list"></div>
      </div>
    </div>

    <div id="site-search-modal" class="modal-backdrop" hidden>
      <div class="modal-pane modal-pane-wide" role="dialog" aria-modal="true" aria-labelledby="site-search-title">
        <div class="modal-header">
          <h3 id="site-search-title">视频网站搜索</h3>
          <button id="close-site-search" type="button" class="close-button" aria-label="关闭">&times;</button>
        </div>
        <div id="site-search-tabs" class="site-tabs"></div>
        <div id="site-search-list" class="site-search-list"></div>
      </div>
    </div>

    <!-- 全集选集模态弹窗 -->
    <div id="episodes-modal" class="modal-backdrop" hidden>
      <div class="modal-pane modal-pane-wide">
        <div class="modal-header">
          <h3 id="episodes-modal-title">剧集列表</h3>
          <button id="close-episodes-button" type="button" class="close-button" aria-label="关闭">&times;</button>
        </div>
        <div id="episodes-grid" class="episodes-grid"></div>
      </div>
    </div>

    <!-- 返回顶部悬浮按钮 -->
    <button id="back-to-top" class="back-to-top" type="button" aria-label="返回顶部" title="返回顶部" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <title>返回顶部</title>
        <path d="m18 15-6-6-6 6"/>
      </svg>
    </button>

    <footer class="footer">
      <p>服务端只做解析与地址校验，视频分片由源站 CDN 直接提供。</p>
      <p>请仅解析你有权访问的内容。</p>
    </footer>
  </div>

  <!-- Channel Console 唤起浮动按钮 -->
  <button id="dev-console-toggle" class="devlog-toggle-btn" type="button" aria-label="开发控制台" title="开发控制台与渠道维护">
    DEV <span id="devlog-count" hidden>0</span>
  </button>

  <!-- Channel Console 模态弹窗 -->
  <div id="dev-modal" class="modal-backdrop" hidden>
    <div class="modal-pane modal-pane-wide dev-console-pane" role="dialog" aria-modal="true" aria-labelledby="dev-modal-title">
      <div class="modal-header">
        <h3 id="dev-modal-title">开发控制台 (Channel Console)</h3>
        <button id="close-dev-modal" type="button" class="close-button" aria-label="关闭">&times;</button>
      </div>

      <!-- 密码解锁门禁 -->
      <div id="dev-auth-gate" class="dev-auth-gate">
        <form id="dev-auth-form" class="dev-auth-box">
          <label for="dev-password-input" class="dev-auth-label">请输入管理员访问密码</label>
          <div class="dev-auth-row">
            <input id="dev-password-input" type="password" placeholder="输入密码以解锁控制台..." autocomplete="current-password" required>
            <button type="submit" class="ghost-button">解锁</button>
          </div>
          <p id="dev-auth-error" class="dev-auth-error" hidden>密码错误，请重新输入</p>
        </form>
      </div>

      <!-- 解锁后主界面 -->
      <div id="dev-console-body" class="dev-console-body" hidden>
        <div class="dev-tabs">
          <button id="dev-tab-playback" type="button" class="site-tab is-active">播放选源日志</button>
          <button id="dev-tab-health" type="button" class="site-tab">源头更新与熔断日志</button>
          <button id="dev-tab-manage" type="button" class="site-tab">渠道增删维护</button>
        </div>

        <!-- Tab 0: 播放选源与换线日志 -->
        <div id="dev-panel-playback" class="dev-tab-panel">
          <div class="dev-panel-head">
            <span>实时选源、切源与异常追踪日志</span>
            <button id="devlog-clear" type="button" class="ghost-button mini-button">清空日志</button>
          </div>
          <ol id="devlog-list" class="devlog-list" role="log" aria-live="polite"></ol>
        </div>

        <!-- Tab 1: 源头更新与清理日志 -->
        <div id="dev-panel-health" class="dev-tab-panel" hidden>
          <div class="dev-panel-head">
            <span>自然日健康账本与熔断清理记录</span>
            <div style="display:flex;gap:8px;">
              <button id="dev-sync-remote" type="button" class="ghost-button mini-button" title="从远程配置源立即拉取最新渠道">手动同步源头</button>
              <button id="dev-refresh-health" type="button" class="ghost-button mini-button">刷新状态</button>
            </div>
          </div>
          <div id="dev-health-summary" class="dev-health-summary"></div>
          <div id="dev-health-list" class="dev-health-list"></div>
        </div>

        <!-- Tab 2: 渠道维护管理 -->
        <div id="dev-panel-manage" class="dev-tab-panel" hidden>
          <form id="dev-channel-add-form" class="channel-add-card">
            <h4 class="channel-card-heading">添加新解析渠道</h4>
            <div class="channel-form-grid">
              <div class="channel-field">
                <label for="new-channel-id">渠道 ID</label>
                <input id="new-channel-id" type="text" placeholder="例: my-browser" pattern="^[a-z0-9][a-z0-9_-]{0,31}$" required>
              </div>
              <div class="channel-field">
                <label for="new-channel-name">渠道名称</label>
                <input id="new-channel-name" type="text" placeholder="例: 备用嗅探源" required>
              </div>
              <div class="channel-field">
                <label for="new-channel-type">类型</label>
                <select id="new-channel-type">
                  <option value="browser">browser (无头浏览器嗅探)</option>
                  <option value="http-api">http-api (HTTP接口请求)</option>
                </select>
              </div>
              <div class="channel-field channel-field-full">
                <label for="new-channel-endpoint">Endpoint 目标地址 (以 = 结尾)</label>
                <input id="new-channel-endpoint" type="url" placeholder="https://example.com/play?url=" required>
              </div>
            </div>
            <div class="channel-form-foot">
              <span id="channel-form-tip" class="channel-form-tip"></span>
              <button type="submit" class="ghost-button">立即添加并生效</button>
            </div>
          </form>

          <div class="channel-list-section">
            <h4 class="channel-card-heading">当前全部渠道列表</h4>
            <div id="dev-channel-items" class="dev-channel-items"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <noscript>
    <p class="noscript">需要启用 JavaScript 才能解析和播放。</p>
  </noscript>
</body>
</html>
